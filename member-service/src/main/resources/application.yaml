server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: member-service

  mongodb:
    # this service's own database (not auth-service's): auth-service creates members through POST /members
    uri: ${MONGODB_URI:mongodb://localhost:27017}
    database: ${MONGODB_DATABASE:member-db}
  data:
    mongodb:
      # creates the indexes declared on Member (unique email, last/first name sort)
      auto-index-creation: true


app:
  security:
    jwt:
      # X.509 PEM public key of auth-service (the contents, not a file path); a literal \n stands for a line break.
      # No default: the app will not start without it. Same value as auth-service's JWT_PUBLIC_KEY.
      public-key: ${JWT_PUBLIC_KEY:}
      # tokens with any other `iss` are rejected; must equal auth-service's issuer
      issuer: ${JWT_ISSUER:http://localhost:8080/auth-service}
      # tokens whose `aud` does not contain this value are rejected; the clients' `aud` lists in auth-service must include it
      audience: ${JWT_AUDIENCE:memeber-service}

management:
  tracing:
    propagation:
      # W3C `traceparent` header: read from incoming requests/records (consume) and added to outgoing calls (produce)
      type: w3c
    sampling:
      # 1.0 = trace every request; lower it in busy environments
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  endpoint:
    health:
      show-details: when-authorized
logging:
  pattern:
    # readable trace context; blank outside a request (startup, background threads)
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-}] "