spring:
  application:
    name: notification-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017}
    database: notification
  data:
    mongodb:
      # creates the unique (source, eventId) index and the TTL index declared on NotificationLog
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092} #broker address
    consumer:
      group-id: notification-service #consumer of broker
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer # payload arrives as json string, service parses it so bad payload are pushed to DLQ
      auto-offset-reset: earliest # read from the first one that was never consumed
      enable-auto-commit: false
    producer:
      # only used to publish failed events to the dead-letter topic
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record # spring commits offset after each record is handled sucessfully, a creash midn record means record is redelivered
      # opens a span per consumed record, continuing the producer's trace from the W3C `traceparent` header
      observation-enabled: true
    template:
      # the dead-letter publish carries the trace context too
      observation-enabled: true

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-}] "

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      enabled: ${TRACING_ENABLED:true}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  logging:
    export:
      otlp:
        # logs are not exported either
        enabled: false
  otlp:
    metrics:
      export:
        # only traces are exported; avoid metric-export errors when no collector is running
        enabled: false
  pattern:
    # readable trace context; blank outside a request (startup, background threads)
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-}] "
app:
  log:
    # notification_log records are deleted this long after creation (TTL index); also the de-duplication window
    retention: 24h
  kafka:
    topic:
      requests: notification.high-priority
      dead-letter: notification.high-priority.DLT
      partitions: 3
      replicas: 1
  mail:
    from: no-reply@example.com
    # emails are only logged (mock); no provider is integrated
    provider: mock
  retry:
    # retries after the first failed delivery; then the event goes to the dead-letter topic
    max-retries: 3
    initial-interval: 1s
    multiplier: 2.0
